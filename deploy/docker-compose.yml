# Vigil local infrastructure.
# Start from the repo root:
#   docker compose --env-file .env -f deploy/docker-compose.yml up -d
#
# All published ports are bound to 127.0.0.1 so nothing is exposed to the LAN.

name: vigil

# Shared build config for the ingest image (built once, reused by all four commands).
x-ingest-image: &ingest-image
  build:
    context: ../ingest
    dockerfile: Dockerfile
    # Build with the host network so `go mod download` can reach the module proxy
    # (the default bridge network has no DNS/egress in this environment).
    network: host
  image: vigil-ingest:local

# ClickHouse credentials + native address for the ingest services (writer, migrate).
x-clickhouse-env: &clickhouse-env
  CLICKHOUSE_DB: ${CLICKHOUSE_DB:-vigil}
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-vigil}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
  VIGIL_CLICKHOUSE_ADDR: clickhouse:9000

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: vigil-redpanda
    command:
      - redpanda
      - start
      # Separate listeners: internal for containers, external for host processes.
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      # Dev-friendly, low-footprint settings for a shared machine.
      - --mode=dev-container
      - --smp=1
      - --memory=1536M
      - --reserve-memory=0M
      - --overprovisioned
      - --default-log-level=info
    ports:
      - "127.0.0.1:19092:19092"   # Kafka API (external / host)
      - "127.0.0.1:18081:18081"   # Schema Registry (external / host)
      - "127.0.0.1:18082:18082"   # HTTP Proxy / pandaproxy (external / host)
      - "127.0.0.1:9644:9644"     # Admin API
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2g
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8.4.13
    container_name: vigil-clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-vigil}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-vigil}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:8123:8123"     # HTTP interface
      - "127.0.0.1:9000:9000"     # Native TCP interface
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
    # Recommended by the ClickHouse image docs to avoid "too many open files".
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2g
    restart: unless-stopped

  postgres:
    image: postgres:16.4-alpine
    container_name: vigil-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vigil}
      POSTGRES_USER: ${POSTGRES_USER:-vigil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=100
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vigil} -d ${POSTGRES_DB:-vigil}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 768m
    restart: unless-stopped

  redis:
    image: redis:7.4.1-alpine
    container_name: vigil-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --maxmemory
      - 384mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

  # --- Ingest service (Go): built from ../ingest, one image, four commands ---

  ingest-migrate:
    <<: *ingest-image
    container_name: vigil-ingest-migrate
    command: ["/usr/local/bin/migrate"]
    environment:
      <<: *clickhouse-env
    depends_on:
      clickhouse:
        condition: service_healthy
    # One-shot: applies the ClickHouse schema (idempotent) and exits.
    restart: "no"

  ingest-topics:
    <<: *ingest-image
    container_name: vigil-ingest-topics
    command: ["/usr/local/bin/topics"]
    environment:
      VIGIL_KAFKA_BROKERS: redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy
    # One-shot: creates the Redpanda topics (idempotent) and exits.
    restart: "no"

  receiver:
    <<: *ingest-image
    container_name: vigil-receiver
    command: ["/usr/local/bin/receiver"]
    environment:
      VIGIL_KAFKA_BROKERS: redpanda:9092
      # Bind all interfaces inside the container; ports are published to 127.0.0.1 below.
      VIGIL_OTLP_GRPC_ADDR: 0.0.0.0:4317
      VIGIL_OTLP_HTTP_ADDR: 0.0.0.0:4318
      VIGIL_HEALTH_ADDR: 0.0.0.0:8088
    ports:
      - "127.0.0.1:4317:4317"   # OTLP/gRPC
      - "127.0.0.1:4318:4318"   # OTLP/HTTP
    depends_on:
      redpanda:
        condition: service_healthy
      ingest-topics:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8088/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m
    restart: unless-stopped

  writer:
    <<: *ingest-image
    container_name: vigil-writer
    command: ["/usr/local/bin/writer"]
    environment:
      <<: *clickhouse-env
      VIGIL_KAFKA_BROKERS: redpanda:9092
      VIGIL_WRITER_HEALTH_ADDR: 0.0.0.0:8089
    ports:
      - "127.0.0.1:8089:8089"   # health
    depends_on:
      redpanda:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      ingest-migrate:
        condition: service_completed_successfully
      ingest-topics:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8089/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

  # --- Load-test pipeline (profile "loadtest"; bench/ingest_load.py drives it) ---
  # The same ingest image and binaries as receiver/writer above, configured to an isolated
  # database (vigil_load), topics (otlp.spans.load / spans.dlq.load), and consumer group, so
  # load data never mixes with real eval data and is removed by dropping the database and
  # topics. Receiver/writer are pinned to cores 1-3 (VIGIL_LOAD_CPUSET): the load generator
  # runs pinned to core 0. Memory limits default to the main services' limits (the
  # "as-is" baseline) and are overridable for the sized run.

  load-db:
    image: clickhouse/clickhouse-server:24.8.4.13
    container_name: vigil-load-db
    profiles: ["loadtest"]
    environment:
      <<: *clickhouse-env
    # Credentials come from the environment (not argv), so they stay out of `docker inspect`.
    entrypoint: ["sh", "-c", "clickhouse-client --host clickhouse --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'CREATE DATABASE IF NOT EXISTS vigil_load'"]
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: "no"

  load-migrate:
    <<: *ingest-image
    container_name: vigil-load-migrate
    profiles: ["loadtest"]
    command: ["/usr/local/bin/migrate"]
    environment:
      <<: *clickhouse-env
      CLICKHOUSE_DB: vigil_load
    depends_on:
      load-db:
        condition: service_completed_successfully
    restart: "no"

  load-topics:
    <<: *ingest-image
    container_name: vigil-load-topics
    profiles: ["loadtest"]
    command: ["/usr/local/bin/topics"]
    environment:
      VIGIL_KAFKA_BROKERS: redpanda:9092
      VIGIL_RAW_TOPIC: otlp.spans.load
      VIGIL_DLQ_TOPIC: spans.dlq.load
      # Disk budget for the load topic (bytes, all partitions); bench/ingest_load.py also
      # checks projected disk before every run.
      VIGIL_RAW_RETENTION_BYTES: ${VIGIL_LOAD_RETENTION_BYTES:-2147483648}
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"

  load-receiver:
    <<: *ingest-image
    container_name: vigil-load-receiver
    profiles: ["loadtest"]
    command: ["/usr/local/bin/receiver"]
    cpuset: ${VIGIL_LOAD_CPUSET:-1-3}
    environment:
      VIGIL_KAFKA_BROKERS: redpanda:9092
      VIGIL_RAW_TOPIC: otlp.spans.load
      VIGIL_DLQ_TOPIC: spans.dlq.load
      VIGIL_OTLP_GRPC_ADDR: 0.0.0.0:4317
      VIGIL_OTLP_HTTP_ADDR: 0.0.0.0:4318
      VIGIL_HEALTH_ADDR: 0.0.0.0:8088
    ports:
      - "127.0.0.1:14317:4317"   # OTLP/gRPC (load)
      - "127.0.0.1:14318:4318"   # OTLP/HTTP (load)
    depends_on:
      load-topics:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8088/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: ${VIGIL_LOAD_RECEIVER_MEM:-256m}
    restart: unless-stopped

  load-writer:
    <<: *ingest-image
    container_name: vigil-load-writer
    profiles: ["loadtest"]
    command: ["/usr/local/bin/writer"]
    cpuset: ${VIGIL_LOAD_CPUSET:-1-3}
    environment:
      <<: *clickhouse-env
      CLICKHOUSE_DB: vigil_load
      VIGIL_KAFKA_BROKERS: redpanda:9092
      VIGIL_RAW_TOPIC: otlp.spans.load
      VIGIL_DLQ_TOPIC: spans.dlq.load
      VIGIL_KAFKA_GROUP: vigil-writer-load
      VIGIL_WRITER_HEALTH_ADDR: 0.0.0.0:8089
    depends_on:
      load-migrate:
        condition: service_completed_successfully
      load-topics:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8089/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: ${VIGIL_LOAD_WRITER_MEM:-512m}
    restart: unless-stopped

volumes:
  redpanda_data:
  clickhouse_data:
  postgres_data:
  redis_data:
