[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hello-agent"
version = "0.1.0"
description = "Week 1 Vigil test agent: a tool-use agent (calculator + mock weather) instrumented with the Vigil SDK."
requires-python = ">=3.10"
# vigil-sdk is installed editably from ../../sdk-python by the Makefile (path dep).
dependencies = ["anthropic>=0.40"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["hello_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: end-to-end test requiring the running stack and an ANTHROPIC_API_KEY"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
