[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hotpotqa-agent"
version = "0.1.0"
description = "HotpotQA multi-hop RAG agent under test: a search tool over a pooled BM25 corpus, instrumented with the Vigil SDK."
requires-python = ">=3.10"
# vigil-sdk is installed editably from ../../sdk-python by the Makefile (path dep).
# anthropic is pinned to the SAME range as the engine and every other agent package (the eval
# worker runs this agent's code inside the engine venv). bm25s provides the Lucene BM25 variant.
dependencies = [
    "anthropic>=1.8,<2",
    "bm25s>=0.2,<0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["hotpotqa_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: end-to-end test requiring the running stack and an ANTHROPIC_API_KEY"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
