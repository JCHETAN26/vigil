# Offline CI: Go units (+ race), Python offline suites against a throwaway Postgres service,
# a minimal-install re-verification of the committed pilot evidence, dashboard typecheck/build +
# the route-mocked browser suite. No model API keys, no paid calls,
# no ClickHouse/Redpanda: the stack-backed (`make test-infra`) and paid (`make test-paid`) gates
# run on the owner's machine, not here.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (ingest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ingest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: ingest/go.mod
          cache-dependency-path: ingest/go.sum
      # -tags=integration also type-checks the stack-backed tests, which CI cannot run.
      - name: go vet
        run: go vet -tags=integration ./...
      - name: go test
        run: go test ./...
      - name: go test -race
        run: go test -race ./...

  python:
    name: python (sdk, engine, agents, bench)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        # Same image as deploy/docker-compose.yml. The engine's DB tests create and drop their
        # own throwaway databases on it, so they execute here instead of self-skipping.
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: vigil
          POSTGRES_PASSWORD: vigil-ci-throwaway
          POSTGRES_DB: vigil
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vigil -d vigil"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: vigil
      POSTGRES_PASSWORD: vigil-ci-throwaway
      POSTGRES_DB: vigil
      # Print every skip reason, so a self-skipped suite is visible in the log, not a silent pass.
      PYTEST_ADDOPTS: -rs
      # Postgres is provided above, so the engine DB tests must execute: an unusable DB fails
      # them instead of self-skipping (engine/tests/conftest.py).
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            sdk-python/pyproject.toml
            engine/pyproject.toml
            agents/*/pyproject.toml
      # One shared venv at engine/.venv, symlinked into the other packages, mirroring the local
      # layout so the per-package Makefiles run unchanged. The heavy tau2-bench extra is not installed.
      - name: Install (shared venv)
        run: |
          python -m venv engine/.venv
          engine/.venv/bin/python -m pip install --upgrade pip
          engine/.venv/bin/python -m pip install \
            -e "./sdk-python[dev]" \
            -e "./engine[dev,api]" \
            -e "./agents/hello_agent[dev]" \
            -e "./agents/hotpotqa_agent[dev]" \
            -e "./agents/tau2_retail_agent[dev]"
          ln -s ../engine/.venv sdk-python/.venv
          for a in hello_agent hotpotqa_agent tau2_retail_agent; do ln -s ../../engine/.venv "agents/$a/.venv"; done
      # Fail here, not as a wall of skips, if the service is not reachable with the engine's config.
      - name: Check Postgres reachable via engine config
        run: engine/.venv/bin/python -c 'import psycopg; from engine.config import pg_dsn; psycopg.connect(pg_dsn(), connect_timeout=5).close()'
      - name: Python offline suites
        run: make test-python

  # A fresh clone's offline path: ONLY the SDK and engine[api] (no agents, no bm25s, no dev
  # extras) in an empty venv, then the committed REAL pilot evidence is re-verified with the
  # production gate. No database, no API key; proves the engine declares what the gate needs.
  evidence:
    name: evidence (minimal install, offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Install SDK + engine[api] into an empty venv
        run: |
          python -m venv "$RUNNER_TEMP/minimal"
          "$RUNNER_TEMP/minimal/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/minimal/bin/python" -m pip install ./sdk-python "./engine[api]"
      - name: Check no agent or retrieval package came along
        run: |
          for p in bm25s hello-agent hotpotqa-agent tau2-retail-agent; do
            if "$RUNNER_TEMP/minimal/bin/python" -m pip show "$p" >/dev/null 2>&1; then
              echo "unexpected package in the minimal install: $p" >&2; exit 1
            fi
          done
          "$RUNNER_TEMP/minimal/bin/python" -m pip list --format=freeze
      - name: Verify the committed pilot evidence (pins, recomputed verdict, accounting)
        run: make demo-evidence DEMO_PY="$RUNNER_TEMP/minimal/bin/python"
      - name: Reproduce the bundle with the generic verifier
        run: env -u PYTHONPATH "$RUNNER_TEMP/minimal/bin/python" bench/regression_verdict.py reproduce demo/evidence/hotpotqa-pilot/bundle

  dashboard:
    name: dashboard (typecheck, build, mocked browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dashboard
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: production build
        run: npm run build
      # The mocked config launches Chrome by default; in CI point it at Playwright's chromium.
      - name: Install Playwright chromium
        run: |
          npx playwright install --with-deps chromium
          echo "PLAYWRIGHT_CHROME_PATH=$(node -p "require('@playwright/test').chromium.executablePath()")" >> "$GITHUB_ENV"
      - name: Mocked browser suite
        working-directory: .
        run: make test-browser
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-mocked-results
          path: dashboard/test-results/
          if-no-files-found: ignore
          retention-days: 7
